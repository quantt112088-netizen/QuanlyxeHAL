    async function managerAttendanceView(){const data=await getData('attendance'),ym=selectedYM(),dates=(data[0]?.marks||[]).filter(mark=>{const parsed=splitVNDate(mark.date,mark.year);return parsed&&ym?parsed.month===ym.month&&parsed.year===ym.year:true;});return `${viewHeading('Chấm công','Theo dõi ngày công của toàn bộ lái xe.','attendance')}<section class="panel"><div class="table-wrap"><table><thead><tr>${sortHead('Họ và tên','name','attendance')}${dates.map(date=>sortHead(date.date,date.date,'attendance')).join('')}${sortHead('Ngày công','total','attendance')}</tr></thead><tbody>${data.map(record=>`<tr><td>${text(record.name)}</td>${record.marks.filter(mark=>{const parsed=splitVNDate(mark.date,mark.year);return parsed&&ym?parsed.month===ym.month&&parsed.year===ym.year:true;}).map(mark=>`<td class="money">${text(mark.label)}</td>`).join('')}<td class="money">${record.total}</td></tr>`).join('')||'<tr><td>Chưa có dữ liệu.</td></tr>'}</tbody></table></div></section>`;}
    async function renderView(){const content=document.getElementById('content');if(!content)return;const serial=++state.renderSerial;if(BETA_TABS.has(state.activeTab)){if(!canManageMonths()){content.innerHTML=`<section class="panel"><div class="empty-state error-state"><i class="bi bi-shield-lock"></i><strong>Không có quyền truy cập</strong><p>Chỉ tài khoản quản lý mới được sử dụng khu vực Nhập liệu (Beta).</p></div></section>`;bindViewEvents();return;}const betaViews={planCatalog:planCatalogView,planInput:planInputView,planTable:planTableView,planSub:planSubView,planAttendance:planAttendanceView,planSalaryParams:planSalaryParamsView,planSalary:planSalaryView},html=(betaViews[state.activeTab]||planCatalogView)();if(serial===state.renderSerial&&document.getElementById('content')){content.innerHTML=html;bindViewEvents();}return;}if(state.profile.role==='driver'&&state.activeTab==='policy'){content.innerHTML=driverPolicyView();bindViewEvents();return;}if(!currentConfig()){content.innerHTML=state.configError?configErrorView():noMonthView();bindViewEvents();return;}content.innerHTML='<div class="loading"><i class="bi bi-arrow-repeat"></i><span>Đang tải dữ liệu…</span></div>';try{const view=state.profile.role==='driver'?({daily:driverDailyView,salary:driverSalaryView,attendance:driverAttendanceView}[state.activeTab]):({trips:managerTripsView,salary:managerSalaryView,attendance:managerAttendanceView}[state.activeTab]),html=await view();if(serial===state.renderSerial&&document.getElementById('content')){content.innerHTML=html;bindViewEvents();}}catch(error){if(serial===state.renderSerial&&document.getElementById('content')){content.innerHTML=errorView(error,state.activeTab);bindViewEvents();}}}
    function bindPlanRange(id,fromKey,toKey){const from=document.getElementById(`plan-range-from-${id}`),to=document.getElementById(`plan-range-to-${id}`);if(from)from.addEventListener('change',event=>{state[fromKey]=event.target.value;renderView();});if(to)to.addEventListener('change',event=>{state[toKey]=event.target.value;renderView();});}
    function bindViewEvents(){document.querySelectorAll('[data-config-retry]').forEach(button=>button.addEventListener('click',async()=>{state.configError='';button.disabled=true;await loadConfig();renderView();}));document.querySelectorAll('[data-refresh]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.refresh)clearCurrentData(button.dataset.refresh);renderView();}));document.querySelectorAll('[data-month]').forEach(button=>button.addEventListener('click',()=>{state.selectedMonth=button.dataset.month;state.openDay='';render();}));document.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>{state.openDay=state.openDay===button.dataset.day?'':button.dataset.day;renderView();}));document.querySelectorAll('[data-sort-table]').forEach(button=>button.addEventListener('click',()=>{const table=button.dataset.sortTable,key=button.dataset.sortKey,sort=state.sorts[table];state.sorts[table]={key,direction:sort.key===key&&sort.direction==='asc'?'desc':'asc'};renderView();}));const search=document.getElementById('trip-search');if(search)search.addEventListener('input',event=>{state.tripSearch=event.target.value;renderView();});[['trip-driver','tripDriver'],['trip-vehicle','tripVehicle']].forEach(([id,field])=>{const select=document.getElementById(id);if(select)select.addEventListener('change',event=>{state[field]=event.target.value;renderView();});});document.querySelectorAll('[data-plan-catalog-add]').forEach(form=>form.addEventListener('submit',event=>{event.preventDefault();savePlanCatalog(form.dataset.planCatalogAdd,form);}));document.querySelectorAll('[data-plan-catalog-edit]').forEach(form=>form.addEventListener('submit',event=>{event.preventDefault();const [category,id]=form.dataset.planCatalogEdit.split(':');updatePlanCatalog(category,id,form);}));document.querySelectorAll('[data-plan-catalog-delete]').forEach(button=>button.addEventListener('click',()=>{const [category,id]=button.dataset.planCatalogDelete.split(':');removePlanCatalog(category,id);}));const planForm=document.getElementById('plan-entry-form');if(planForm){updatePlanVehicleTonnage(planForm);updatePlanDerived(planForm);planForm.addEventListener('input',event=>{if(['km_pickup','km_return','vehicle_revenue'].includes(event.target.name))updatePlanDerived(planForm);});planForm.elements.plate?.addEventListener('change',()=>updatePlanVehicleTonnage(planForm));planForm.addEventListener('submit',event=>{event.preventDefault();savePlanEntry(planForm);});}document.getElementById('plan-entry-reset')?.addEventListener('click',()=>{state.planEditingId=null;state.planError='';state.planNotice='';renderView();});document.getElementById('beta-month-select')?.addEventListener('change',event=>{state.betaMonth=event.target.value;state.planSearch='';renderView();});document.getElementById('plan-search')?.addEventListener('input',event=>{state.planSearch=event.target.value;renderView();});document.querySelectorAll('[data-plan-edit]').forEach(button=>button.addEventListener('click',()=>{state.planEditingId=button.dataset.planEdit;state.planError='';state.planNotice='';state.activeTab='planInput';render();}));document.querySelectorAll('[data-plan-delete]').forEach(button=>button.addEventListener('click',()=>removePlanEntry(button.dataset.planDelete)));document.getElementById('plan-export')?.addEventListener('click',exportPlanXlsx);document.getElementById('plan-sub-customer')?.addEventListener('change',event=>{state.planSubCustomer=event.target.value;renderView();});bindPlanRange('sub','planSubFrom','planSubTo');bindPlanRange('attendance','planAttendanceFrom','planAttendanceTo');bindPlanRange('salary','planSalaryFrom','planSalaryTo');document.getElementById('plan-sub-export')?.addEventListener('click',exportPlanSubXlsx);document.getElementById('plan-salary-params-form')?.addEventListener('submit',event=>{event.preventDefault();savePlanSalaryParameters(event.currentTarget);});document.querySelectorAll('[data-plan-salary-adjust]').forEach(form=>form.addEventListener('submit',event=>{event.preventDefault();savePlanSalaryAdjustment(form.dataset.planSalaryAdjust,event.currentTarget);}));document.getElementById('plan-salary-export')?.addEventListener('click',exportPlanSalaryXlsx);}
    function bindShellEvents(){document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{state.activeTab=button.dataset.tab;state.openDay='';if(!BETA_TABS.has(state.activeTab)){state.planEditingId=null;state.planError='';state.planNotice='';}render();}));document.getElementById('month-select')?.addEventListener('change',event=>{state.selectedMonth=event.target.value;state.openDay='';render();});document.getElementById('sheet-button')?.addEventListener('click',()=>{state.sheetError='';state.sheetSuccess='';state.sheetEditMonth=null;state.sheetModal=true;render();});document.getElementById('password-button')?.addEventListener('click',()=>{state.passwordModal=true;render();});document.getElementById('logout-button')?.addEventListener('click',logout);document.getElementById('cancel-password')?.addEventListener('click',()=>{state.passwordModal=false;render();});document.querySelectorAll('[data-sheet-edit]').forEach(button=>button.addEventListener('click',()=>{state.sheetEditMonth=button.dataset.sheetEdit;state.sheetError='';state.sheetSuccess='';render();}));document.getElementById('cancel-sheet')?.addEventListener('click',()=>{state.sheetModal=false;state.sheetEditMonth=null;state.sheetSaving=false;state.sheetError='';state.sheetSuccess='';render();});document.getElementById('password-backdrop')?.addEventListener('click',event=>{if(event.target.id==='password-backdrop'){state.passwordModal=false;render();}});document.getElementById('sheet-backdrop')?.addEventListener('click',event=>{if(event.target.id==='sheet-backdrop'){state.sheetModal=false;state.sheetEditMonth=null;state.sheetSaving=false;state.sheetError='';state.sheetSuccess='';render();}});document.getElementById('password-form')?.addEventListener('submit',event=>{event.preventDefault();changePassword(event.currentTarget);});document.getElementById('sheet-form')?.addEventListener('submit',event=>{event.preventDefault();saveMonthSheet(event.currentTarget);});}
    function render(){if(!state.authReady||!state.user||!state.profile){APP.innerHTML=renderLogin();document.getElementById('login-form')?.addEventListener('submit',event=>{event.preventDefault();login(event.currentTarget);});return;}APP.innerHTML=renderShell();bindShellEvents();renderView();}
    async function boot(){render();await loadConfig();initialiseFirebase();render();}
