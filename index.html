<body>
  <div id="app" aria-live="polite"></div>
  <script src="config/firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, doc, getDoc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const APP = document.getElementById('app');
    const TAB_LABELS = { driver:{daily:'Thu nhập theo ngày',salary:'Bảng lương tháng',attendance:'Chấm công'}, manager:{trips:'Chi tiết chuyến',salary:'Bảng lương',attendance:'Chấm công'} };
    const TAB_ICONS = {daily:'bi-cash-stack',trips:'bi-truck',salary:'bi-receipt',attendance:'bi-calendar-check'};
    const currentMonth = new Date().toLocaleDateString('en-CA',{year:'numeric',month:'2-digit'}).slice(0,7);
    const state = { config:null,fileConfig:null,remoteConfig:{},configError:'',selectedMonth:currentMonth,auth:null,db:null,sheetsUnsubscribe:null,authReady:false,authLoading:false,authError:'',firebaseError:'',user:null,profile:null,profileError:'',activeTab:'daily',cache:new Map(),openDay:'',tripSearch:'',tripDriver:'',tripVehicle:'',tripStatus:'',sorts:{trips:{key:'date',direction:'desc'},salary:{key:'Họ và tên',direction:'asc'},attendance:{key:'name',direction:'asc'}},passwordModal:false,sheetModal:false,sheetError:'',sheetSaving:false,renderSerial:0 };
    const AUTH_TIMEOUT_MS = 15000;

    const escapeHtml = (value='') => String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const text = value => escapeHtml(value ?? '');
    const money = value => `${(Number(value)||0).toLocaleString('vi-VN')} đ`;
    const parseMoney = value => { const clean=String(value??'').replace(/[^\d-]/g,''); return clean ? Number.parseInt(clean,10)||0 : 0; };
    function normalizeLabel(value=''){return String(value).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/đ/g,'d').replace(/\s+/g,' ').trim();}
    const namesMatch = (left,right) => normalizeLabel(left)===normalizeLabel(right);
    function parseVNDate(value){const m=/(?:(\d{1,2})\/(\d{1,2})\/(\d{4})|(\d{4})-(\d{1,2})-(\d{1,2}))/.exec(String(value||''));if(!m)return 0;return m[3]?new Date(+m[3],+m[2]-1,+m[1]).getTime():new Date(+m[4],+m[5]-1,+m[6]).getTime();}
    function monthLabel(key){if(!/^\d{4}-\d{2}$/.test(key))return key;const [year,month]=key.split('-');return `Tháng ${Number(month)}/${year}`;}
    function mergeMonthConfigs(){state.config={...(state.fileConfig||{}),...state.remoteConfig};}
    function currentConfig(){return state.config?.[state.selectedMonth]||null;}
    function roleLabel(){return state.profile?.role==='manager'?'Quản lý':'Lái xe';}
    function currentDriverName(){return state.profile?.driverName||'';}
    function firebaseConfigError(){const cfg=window.FIREBASE_CONFIG||{},missing=['apiKey','authDomain','projectId','appId'].filter(key=>typeof cfg[key]!=='string'||!cfg[key].trim());if(missing.length)return `Thiếu ${missing.join(', ')} trong config/firebase-config.js.`;if(!/^AIza[\w-]{20,}$/.test(cfg.apiKey.trim()))return 'apiKey trong config/firebase-config.js có định dạng không hợp lệ.';if(!/^[a-z0-9-]+(?:\.[a-z0-9-]+)+$/i.test(cfg.authDomain.trim()))return 'authDomain trong config/firebase-config.js có định dạng không hợp lệ.';if(!/^[a-z0-9-]+$/i.test(cfg.projectId.trim()))return 'projectId trong config/firebase-config.js có định dạng không hợp lệ.';if(!/^\d+:\d+:[a-z0-9]+:[a-z0-9]+$/i.test(cfg.appId.trim()))return 'appId trong config/firebase-config.js có định dạng không hợp lệ.';return '';}
    function firebaseConfigured(){return !firebaseConfigError();}
    function firebaseMessage(error){const labels={'auth/invalid-credential':'Email hoặc mật khẩu không đúng.','auth/invalid-email':'Email không hợp lệ.','auth/user-disabled':'Tài khoản này đã bị vô hiệu hóa.','auth/too-many-requests':'Có quá nhiều lần thử. Vui lòng thử lại sau.','auth/network-request-failed':'Không thể kết nối tới Firebase. Kiểm tra mạng và domain được phép rồi thử lại.','auth/operation-not-allowed':'Email/mật khẩu chưa được bật trong Firebase Authentication.','auth/api-key-not-valid':'Firebase apiKey không hợp lệ. Kiểm tra config/firebase-config.js.','auth/invalid-api-key':'Firebase apiKey không hợp lệ. Kiểm tra config/firebase-config.js.','auth/requires-recent-login':'Vui lòng đăng nhập lại rồi thử đổi mật khẩu.','auth/weak-password':'Mật khẩu mới chưa đủ mạnh.','permission-denied':'Không có quyền thực hiện thao tác này.','app/request-timeout':'Không thể kết nối, vui lòng thử lại.'};return labels[error?.code]||error?.message||'Đã xảy ra lỗi. Vui lòng thử lại.';}
    function withTimeout(promise,label){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=window.setTimeout(()=>{const error=new Error(`${label} không phản hồi sau ${AUTH_TIMEOUT_MS/1000} giây.`);error.code='app/request-timeout';reject(error);},AUTH_TIMEOUT_MS);})]).finally(()=>window.clearTimeout(timer));}
    function parseCsv(csv){const rows=[];let row=[],field='',inQuotes=false;const source=String(csv||'').replace(/^﻿/,'');for(let i=0;i<source.length;i+=1){const char=source[i],next=source[i+1];if(char==='"'){if(inQuotes&&next==='"'){field+='"';i+=1;}else inQuotes=!inQuotes;}else if(char===','&&!inQuotes){row.push(field);field='';}else if((char==='\n'||char==='\r')&&!inQuotes){if(char==='\r'&&next==='\n')i+=1;row.push(field);rows.push(row);row=[];field='';}else field+=char;}if(field||row.length){row.push(field);rows.push(row);}return rows;}
    function findHeader(rows,matcher){return rows.findIndex(row=>matcher((row||[]).map(normalizeLabel)));}
    const TRIP_GROUPS=[{key:'summary',label:'KẾT QUẢ TỔNG HỢP',match:'ket qua tong hop'},{key:'revenue',label:'CHI TIẾT DOANH THU',match:'chi tiet doanh thu'},{key:'cost',label:'CHI TIẾT CHI PHÍ',match:'chi tiet chi phi'}];
    function findTripGroups(rows,headerIndex){const candidates=[];for(let index=headerIndex-1;index>=Math.max(0,headerIndex-4);index-=1)candidates.push({index,row:rows[index]||[]});candidates.push({index:headerIndex,row:rows[headerIndex]||[]});return candidates.map(candidate=>({...candidate,groups:candidate.row.map((cell,column)=>{const raw=String(cell??'').trim(),label=normalizeLabel(raw),group=TRIP_GROUPS.find(item=>label.includes(item.match));return group?{key:group.key,label:group.label,column,raw}:null;}).filter(Boolean)})).filter(candidate=>candidate.groups.length);}
    function logTripHeaders(rows,headerIndex,groupRows,foundGroups){const headerRows=[headerIndex-1,headerIndex].filter(index=>index>=0).map(index=>({row:index+1,cells:(rows[index]||[]).map(cell=>String(cell??'').trim())}));console.info('[HAL Trips] Header inspection',{headerRow:headerIndex+1,headerRows,groupRows:groupRows.map(item=>({row:item.index+1,groups:item.groups.map(group=>({label:group.label,column:group.column+1,raw:group.raw}))})),foundGroups:foundGroups.map(group=>({label:group.label,row:group.rowIndex+1,column:group.column+1,raw:group.raw}))});}
    function parseTrips(rows){
      const headerIndex=rows.findIndex(row=>{const labels=(row||[]).map(normalizeLabel);return labels.some(label=>label.includes('ten lai xe'))&&labels.some(label=>label==='ngay'||label.includes('date'));});
      const headers=headerIndex>=0?(rows[headerIndex]||[]).map(value=>String(value??'').trim()):[];
      const driverIndex=headers.findIndex(header=>normalizeLabel(header).includes('ten lai xe'));
      const dateIndex=headers.findIndex(header=>{const label=normalizeLabel(header);return label==='ngay'||label.includes('date');});
      const missing=[driverIndex<0&&'cột “Tên lái xe”',dateIndex<0&&'cột “Ngày/DATE”'].filter(Boolean);
      if(headerIndex<0||missing.length)throw new Error(`Không đọc được cấu trúc tab “Chi tiết chuyến”. Còn thiếu: ${(missing.length?missing:['hàng tiêu đề chứa “Tên lái xe” và “Ngày/DATE”']).join(', ')}. Các cột đã tìm thấy: ${headers.filter(Boolean).join(', ')||'không đọc được hàng tiêu đề nào'}.`);
      const groupRows=findTripGroups(rows,headerIndex),foundGroups=groupRows.flatMap(item=>item.groups.map(group=>({...group,rowIndex:item.index}))),groupStarts=Object.fromEntries(TRIP_GROUPS.map(group=>[group.key,foundGroups.find(found=>found.key===group.key)]));
      logTripHeaders(rows,headerIndex,groupRows,foundGroups);
      const costStart=groupStarts.cost?.column??-1,groupStartIndexes=Object.values(groupStarts).filter(Boolean).map(group=>group.column);
      if(costStart<0){const found=foundGroups.length?[...new Set(foundGroups.map(group=>`${group.label} (hàng ${group.rowIndex+1}, cột ${group.column+1})`))].join(', '):'không tìm thấy nhãn nhóm nào';throw new Error(`Không tìm thấy nhóm “CHI TIẾT CHI PHÍ” gần hàng tiêu đề. Nhóm đã tìm thấy: ${found}. Các cột đã tìm thấy: ${headers.filter(Boolean).join(', ')||'không đọc được hàng tiêu đề nào'}. Kiểm tra Console với tiền tố [HAL Trips].`);}
      const firstGroupedColumn=Math.min(...groupStartIndexes);const noteIndex=headers.findIndex((header,index)=>index>costStart&&/^(ghi chu|note)$/.test(normalizeLabel(header)));const costEnd=noteIndex>=0?noteIndex:headers.length;
      const column=index=>({key:`column-${index}`,label:headers[index],index});const serial=header=>/(?:^|\s)(?:stt|so thu tu)$/.test(normalizeLabel(header));
      const infoColumns=headers.map((header,index)=>({header,index})).filter(({header,index})=>header&&index<firstGroupedColumn&&index!==dateIndex&&index!==driverIndex&&!serial(header)).map(({index})=>column(index));
      const costColumns=headers.map((header,index)=>({header,index})).filter(({header,index})=>header&&index>=costStart&&index<costEnd).map(({index})=>column(index));
      const vehicleColumns=infoColumns.filter(item=>/bien kiem soat|bien so|loai xe|xe van chuyen/.test(normalizeLabel(item.label)));const statusColumn=infoColumns.find(item=>/trang thai|status/.test(normalizeLabel(item.label)));const wageColumn=costColumns.find(item=>{const label=normalizeLabel(item.label);return label.includes('luong lai xe')&&label.includes('chuyen');});const visibleColumns=[...infoColumns,...costColumns];
      const records=rows.slice(headerIndex+1).filter(row=>String(row?.[driverIndex]||'').trim()).map((row,index)=>{const cells=Object.fromEntries(visibleColumns.map(item=>[item.key,String(row[item.index]??'').trim()]));const vehicle=vehicleColumns.map(item=>cells[item.key]).filter(Boolean).join(' ');return {id:`${index}-${row[driverIndex]}-${row[dateIndex]}`,date:String(row[dateIndex]??'').trim(),driver:String(row[driverIndex]??'').trim(),cells,wage:wageColumn?parseMoney(row[wageColumn.index]):0,vehicle,status:statusColumn?cells[statusColumn.key]:'',searchText:[row[dateIndex],row[driverIndex],...Object.values(cells)].join(' ')};});
      return {records,dateColumn:column(dateIndex),driverColumn:column(driverIndex),infoColumns,costColumns};
    }
    function parseSalary(rows){const headerIndex=findHeader(rows,headers=>headers.some(header=>header==='ho va ten'));if(headerIndex<0)throw new Error('Không tìm thấy cột “Họ và tên” trong tab “Bảng lương”.');const headers=(rows[headerIndex]||[]).map(value=>String(value??'').trim());const nameIndex=headers.findIndex(header=>normalizeLabel(header)==='ho va ten');const records=rows.slice(headerIndex+1).filter(row=>String(row?.[nameIndex]||'').trim()).map(row=>Object.fromEntries(headers.map((header,index)=>[header,String(row[index]??'').trim()]).filter(([header])=>header)));return {headers,records};}
    function parseMark(value){const raw=String(value??'').trim(),up=raw.toUpperCase().replace(/\s+/g,'');if(!raw||['-','NGHỈ','OFF','O'].includes(up))return {status:'off',value:0,label:''};if(up==='X')return {status:'full',value:1,label:'X'};if(['1/2','X/2','0.5','0,5'].includes(up)||up.includes('NỬA')||up.includes('HALF'))return {status:'half',value:.5,label:'½'};return {status:'other',value:1,label:raw};}
    function parseAttendance(rows){const headerIndex=findHeader(rows,headers=>headers.some(header=>header==='ho va ten'));if(headerIndex<0)throw new Error('Không tìm thấy cột “Họ và tên” trong tab “Chấm công”.');const weekdayRow=rows[headerIndex]||[],dateRow=rows[headerIndex+1]||[],nameIndex=weekdayRow.findIndex(value=>normalizeLabel(value)==='ho va ten'),dates=[];for(let index=nameIndex+1;index<Math.max(weekdayRow.length,dateRow.length);index+=1){const date=String(dateRow[index]??'').trim();if(date)dates.push({index,date,weekday:String(weekdayRow[index]??'').trim()});}return rows.slice(headerIndex+2).filter(row=>String(row?.[nameIndex]||'').trim()).map(row=>{const marks=dates.map(item=>({...item,...parseMark(row[item.index])}));return {name:String(row[nameIndex]).trim(),marks,total:marks.reduce((sum,item)=>sum+item.value,0)};});}
    const parsers={trips:parseTrips,salary:parseSalary,attendance:parseAttendance};
    async function loadConfig(){try{const response=await fetch('config/sheet-links.json',{cache:'no-store'});if(!response.ok)throw new Error(`Không tải được file cấu hình (mã ${response.status}).`);const config=await response.json();if(!config||Array.isArray(config))throw new Error('File cấu hình tháng không đúng định dạng.');state.fileConfig=config;mergeMonthConfigs();}catch(error){state.configError=error.message||'Không tải được file cấu hình tháng.';}}
    async function getData(tab){const month=state.selectedMonth,config=currentConfig();if(!config)throw new Error('Chưa có dữ liệu tháng này.');const tabConfig=config.tabs?.[tab]||{};if(!tabConfig.sheetName&&!tabConfig.gid&&tabConfig.gid!==0)throw new Error(`Thiếu GID hoặc tên tab cho “${TAB_LABELS.manager[tab]||tab}” trong cấu hình tháng.`);const key=`${month}:${tab}`;if(state.cache.has(key))return state.cache.get(key);const promise=(async()=>{const url=tabConfig.sheetName?`https://docs.google.com/spreadsheets/d/${encodeURIComponent(config.sheetId)}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabConfig.sheetName)}`:`https://docs.google.com/spreadsheets/d/${encodeURIComponent(config.sheetId)}/export?format=csv&gid=${encodeURIComponent(tabConfig.gid)}`;let response;try{response=await fetch(url,{cache:'no-store'});}catch{throw new Error('Không kết nối được Google Sheets. Kiểm tra mạng rồi thử lại.');}if(!response.ok)throw new Error(response.status===401||response.status===403?'Google Sheet chưa được chia sẻ “Anyone with the link can view”, hoặc bạn không có quyền xem.':`Không tải được dữ liệu Google Sheets (mã ${response.status}).`);const csv=await response.text();if(/^\s*<(?:!doctype|html)/i.test(csv))throw new Error('Google Sheets không trả dữ liệu CSV. Kiểm tra quyền chia sẻ “Anyone with the link can view” và tên/GID của tab.');return parsers[tab](parseCsv(csv));})();state.cache.set(key,promise);try{const data=await promise;state.cache.set(key,data);return data;}catch(error){state.cache.delete(key);throw error;}}
    function clearCurrentData(tab){state.cache.delete(`${state.selectedMonth}:${tab}`);}
    function subscribeToSheetMonths(){state.sheetsUnsubscribe?.();state.sheetsUnsubscribe=onSnapshot(collection(state.db,'sheetMonths'),snapshot=>{state.remoteConfig=Object.fromEntries(snapshot.docs.map(item=>[item.id,item.data()]));mergeMonthConfigs();if(state.authReady&&state.profile)render();},error=>{state.configError=`Không tải được danh sách tháng do quản lý cập nhật: ${firebaseMessage(error)}`;if(state.authReady&&state.profile)render();});}
    function initialiseFirebase(){const configError=firebaseConfigError();if(configError){console.error('[HAL Auth] Cấu hình Firebase không hợp lệ:',configError);state.firebaseError=configError;state.authReady=true;return;}try{console.log('[HAL Auth] Khởi tạo Firebase thành công.');const app=initializeApp(window.FIREBASE_CONFIG);state.auth=getAuth(app);state.db=getFirestore(app);onAuthStateChanged(state.auth,async user=>{state.user=user;state.profile=null;if(!user){console.log('[HAL Auth] Không có phiên đăng nhập.');state.authLoading=false;state.authReady=true;render();return;}console.log('[HAL Auth] Firebase Auth thành công; bắt đầu đọc hồ sơ Firestore.',{uid:user.uid});state.profileError='';try{const snapshot=await withTimeout(getDoc(doc(state.db,'users',user.uid)),'Đọc hồ sơ Firestore'),profile=snapshot.data();console.log('[HAL Auth] Đọc hồ sơ Firestore thành công.',{uid:user.uid,exists:snapshot.exists()});if(!snapshot.exists()||!['driver','manager'].includes(profile?.role)||(profile.role==='driver'&&!String(profile.driverName||'').trim())){console.warn('[HAL Auth] Hồ sơ Firestore thiếu hoặc không hợp lệ.',{uid:user.uid});state.profileError='Tài khoản chưa có hồ sơ hoặc quyền hợp lệ. Hãy liên hệ quản trị viên.';signOut(state.auth).catch(signOutError=>console.error('[HAL Auth] Không thể đăng xuất hồ sơ không hợp lệ.',signOutError));}else{state.profile={role:profile.role,driverName:String(profile.driverName||'').trim()};state.activeTab=profile.role==='manager'?'trips':'daily';subscribeToSheetMonths();}}catch(error){console.error('[HAL Auth] Đọc hồ sơ Firestore thất bại.',error);state.profileError=`Không thể đọc hồ sơ tài khoản: ${firebaseMessage(error)}`;signOut(state.auth).catch(signOutError=>console.error('[HAL Auth] Không thể đăng xuất sau lỗi hồ sơ.',signOutError));}finally{state.authLoading=false;state.authReady=true;render();}});}catch(error){console.error('[HAL Auth] Khởi tạo Firebase thất bại.',error);state.firebaseError=`Không thể khởi tạo Firebase: ${firebaseMessage(error)}`;state.authReady=true;}}
    async function login(form){const email=form.email.value.trim(),password=form.password.value;if(!email||!password){state.authError='Vui lòng nhập email và mật khẩu.';render();return;}if(!state.auth){console.error('[HAL Auth] Không thể bắt đầu đăng nhập: Firebase Auth chưa sẵn sàng.');state.authError='Firebase chưa sẵn sàng. Vui lòng tải lại trang rồi thử lại.';render();return;}state.authLoading=true;state.authError='';state.profileError='';render();console.log('[HAL Auth] Bắt đầu đăng nhập Firebase.',{email});try{const credential=await withTimeout(signInWithEmailAndPassword(state.auth,email,password),'Đăng nhập Firebase');console.log('[HAL Auth] Firebase Auth đăng nhập thành công.',{uid:credential.user.uid});}catch(error){console.error('[HAL Auth] Firebase Auth đăng nhập thất bại.',error);state.authError=firebaseMessage(error);state.authLoading=false;render();}}
    async function logout(){state.authError='';state.profileError='';state.authLoading=false;state.sheetsUnsubscribe?.();state.sheetsUnsubscribe=null;state.remoteConfig={};mergeMonthConfigs();if(state.auth)await signOut(state.auth);}
    async function changePassword(form){const oldPassword=form.oldPassword.value,newPassword=form.newPassword.value,repeatPassword=form.repeatPassword.value,message=document.getElementById('password-message');if(!oldPassword||!newPassword||!repeatPassword){message.textContent='Vui lòng nhập đầy đủ thông tin.';return;}if(newPassword.length<6){message.textContent='Mật khẩu mới cần ít nhất 6 ký tự.';return;}if(newPassword!==repeatPassword){message.textContent='Mật khẩu mới nhập lại không khớp.';return;}const submit=form.querySelector('[type=submit]');submit.disabled=true;submit.textContent='Đang cập nhật…';try{await reauthenticateWithCredential(state.user,EmailAuthProvider.credential(state.user.email,oldPassword));await updatePassword(state.user,newPassword);state.passwordModal=false;render();}catch(error){message.textContent=firebaseMessage(error);submit.disabled=false;submit.textContent='Đổi mật khẩu';}}
    function extractSheetId(url){return /\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/.exec(String(url||''))?.[1]||'';}

    function renderLogin(){const message=state.firebaseError||state.profileError||state.authError;return `<div class="auth-page"><aside class="auth-aside"><div class="brand"><div class="brand-mark">HAL</div><div class="brand-copy"><small>Vận hành</small>Đội xe HAL</div></div><div><h1>Quản lý đội xe rõ ràng, cập nhật theo từng tháng.</h1><p>Theo dõi chuyến xe, lương và chấm công trên một giao diện thống nhất.</p></div><div class="auth-note">Cổng thông tin nội bộ · Hoàng Anh Logistics</div></aside><main class="auth-main"><section class="auth-card"><h2>Đăng nhập</h2><p>Sử dụng tài khoản được quản trị viên cấp.</p>${state.authReady&&!state.firebaseError?`<form id="login-form"><label class="field"><span>Email</span><input class="input" type="email" name="email" autocomplete="email" placeholder="tenban@congty.com" required></label><label class="field"><span>Mật khẩu</span><input class="input" type="password" name="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required></label><div class="form-message">${text(message)}</div><button class="button button-primary button-block" type="submit" ${state.authLoading?'disabled':''}>${state.authLoading?'Đang đăng nhập…':'Đăng nhập'}</button></form>`:`<div class="empty-state error-state"><i class="bi bi-exclamation-circle"></i><strong>${state.authReady?'Chưa thể đăng nhập':'Đang chuẩn bị đăng nhập'}</strong><p>${text(message||'Đang kết nối hệ thống xác thực…')}</p></div>`}<div class="info-box"><i class="bi bi-shield-check"></i><span>Mật khẩu được Firebase Authentication quản lý, không được lưu trong mã nguồn website hoặc Google Sheets.</span></div></section></main></div>`;}

    function configErrorView(){return `${viewHeading('Lỗi cấu hình','Không tải được file cấu hình tháng từ server.','')}<section class="panel"><div class="empty-state error-state"><i class="bi bi-exclamation-triangle"></i><strong>Không tải được cấu hình tháng</strong><p>${text(state.configError)}</p><button class="button" type="button" data-config-retry><i class="bi bi-arrow-clockwise"></i> Thử lại</button></div></section>`;}
    async function driverDailyView(){const data=await getData('trips'),trips=data.records.filter(trip=>namesMatch(trip.driver,currentDriverName())),byDate=new Map();trips.forEach(trip=>{const day=byDate.get(trip.date)||{date:trip.date,trips:[],total:0};day.trips.push(trip);day.total+=trip.wage;byDate.set(trip.date,day);});const days=[...byDate.values()].sort((a,b)=>parseVNDate(b.date)-parseVNDate(a.date)),total=trips.reduce((sum,trip)=>sum+trip.wage,0),tripInfo=trip=>data.infoColumns.map(column=>trip.cells[column.key]).filter(Boolean).join(' · ')||'Chuyến hàng';return `${viewHeading('Thu nhập theo ngày','Lương lái xe theo chuyến được cập nhật từ bảng chuyến.','trips')}<div class="metric-grid"><div class="metric"><span class="label">Tổng lương chuyến</span><strong class="value teal">${money(total)}</strong></div><div class="metric"><span class="label">Số chuyến đã ghi nhận</span><strong class="value">${trips.length}</strong></div><div class="metric"><span class="label">Số ngày có chuyến</span><strong class="value amber">${days.length}</strong></div></div><section class="panel"><div class="panel-heading"><div><h3>Danh sách theo ngày</h3><p>Nhấn vào từng ngày để xem chi tiết chuyến.</p></div></div>${days.length?`<div class="day-list">${days.map(day=>`<article class="day-card"><button class="day-toggle" type="button" data-day="${text(day.date)}"><span class="day-title"><strong>${text(day.date)}</strong><span>${day.trips.length} chuyến</span></span><span class="amount">${money(day.total)} <i class="bi bi-chevron-${state.openDay===day.date?'up':'down'}"></i></span></button>${state.openDay===day.date?`<div class="trip-details">${day.trips.map(trip=>`<div class="trip-detail"><span>${text(tripInfo(trip))}</span><b>${money(trip.wage)}</b></div>`).join('')}</div>`:''}</article>`).join('')}</div>`:`<div class="empty-state"><i class="bi bi-inbox"></i><strong>Chưa có chuyến xe</strong><p>Chưa tìm thấy chuyến nào của bạn trong tháng này.</p></div>`}</section>`;}
    async function driverSalaryView(){const data=await getData('salary'),row=data.records.find(record=>namesMatch(record['Họ và tên'],currentDriverName()));if(!row)return `${viewHeading('Bảng lương tháng','Số liệu tổng hợp từ bảng lương.','salary')}<section class="panel"><div class="empty-state"><i class="bi bi-person-x"></i><strong>Chưa có bảng lương</strong><p>Không tìm thấy dòng lương tương ứng với tên tài xế trong Google Sheet.</p></div></section>`;const skip=new Set(['STT','Họ và tên','Hưởng lương CB?']),keys=Object.keys(row).filter(key=>!skip.has(key)),totalKey=keys.find(key=>/thực nhận|thực lĩnh|tổng thực/i.test(key))||keys.find(key=>/tổng/i.test(key));return `${viewHeading('Bảng lương tháng','Số liệu tổng hợp được cập nhật từ quản lý.','salary')}<section class="panel">${totalKey?`<div class="salary-total"><small>${text(totalKey)}</small><strong>${money(parseMoney(row[totalKey]))}</strong></div>`:''}<div class="salary-grid">${keys.filter(key=>key!==totalKey).map(key=>`<div class="salary-item"><div class="label">${text(key)}</div><div class="value">${/lương|pc |tổng|thực|phí/i.test(key)?money(parseMoney(row[key])):text(row[key])}</div></div>`).join('')}</div></section>`;}
    async function driverAttendanceView(){const data=await getData('attendance'),record=data.find(item=>namesMatch(item.name,currentDriverName()));if(!record)return `${viewHeading('Chấm công','Tổng hợp ngày công trong tháng.','attendance')}<section class="panel"><div class="empty-state"><i class="bi bi-person-x"></i><strong>Chưa có chấm công</strong><p>Không tìm thấy dòng chấm công tương ứng với tên tài xế.</p></div></section>`;return `${viewHeading('Chấm công','Tổng hợp ngày công trong tháng.','attendance')}<section class="panel"><div class="attendance-summary"><div class="attendance-chip"><b>${record.total}</b><span>ngày công</span></div><div class="attendance-chip"><b>${record.marks.length}</b><span>ngày trong bảng</span></div></div><div class="attendance-grid">${record.marks.map(mark=>`<div class="attendance-cell ${mark.status}"><b>${text(mark.date.split('/')[0])}</b><span>${text(mark.weekday)}</span>${mark.label?`<em>${text(mark.label)}</em>`:''}</div>`).join('')}</div></section>`;}
    function sortRecords(records,table,valueFor){const {key,direction}=state.sorts[table],sign=direction==='asc'?1:-1;return [...records].sort((left,right)=>{const a=valueFor(left,key),b=valueFor(right,key);if(/date|ngày/i.test(key))return(parseVNDate(a)-parseVNDate(b))*sign;const an=typeof a==='number'?a:parseMoney(a),bn=typeof b==='number'?b:parseMoney(b);if(an||bn)return(an-bn)*sign;return String(a||'').localeCompare(String(b||''),'vi')*sign;});}
    function sortHead(label,key,table){const sort=state.sorts[table],icon=sort.key===key?(sort.direction==='asc'?'bi-arrow-up':'bi-arrow-down'):'bi-arrow-down-up';return `<th><button type="button" data-sort-table="${table}" data-sort-key="${text(key)}">${text(label)} <i class="bi ${icon}"></i></button></th>`;}
    async function managerTripsView(){const data=await getData('trips'),trips=data.records,values=field=>[...new Set(trips.map(trip=>trip[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));let shown=trips.filter(trip=>(!state.tripSearch||trip.searchText.toLowerCase().includes(state.tripSearch.toLowerCase()))&&(!state.tripDriver||trip.driver===state.tripDriver)&&(!state.tripVehicle||trip.vehicle.includes(state.tripVehicle))&&(!state.tripStatus||trip.status===state.tripStatus));shown=sortRecords(shown,'trips',(trip,key)=>key==='date'?trip.date:key==='driver'?trip.driver:key==='vehicle'?trip.vehicle:key==='status'?trip.status:trip.cells[key]||'');const vehicleValues=values('vehicle'),columns=[data.dateColumn,data.driverColumn,...data.infoColumns,...data.costColumns];return `${viewHeading('Chi tiết chuyến','Hiển thị thông tin chuyến xe và toàn bộ chi phí theo từng chuyến.','trips')}<section class="panel"><div class="filters"><input class="input search" id="trip-search" type="search" placeholder="Tìm theo ngày, lái xe, thông tin chuyến…" value="${text(state.tripSearch)}"><select id="trip-driver"><option value="">Tất cả lái xe</option>${values('driver').map(value=>`<option value="${text(value)}" ${value===state.tripDriver?'selected':''}>${text(value)}</option>`).join('')}</select>${vehicleValues.length?`<select id="trip-vehicle"><option value="">Tất cả loại/biển số xe</option>${vehicleValues.map(value=>`<option value="${text(value)}" ${value===state.tripVehicle?'selected':''}>${text(value)}</option>`).join('')}</select>`:''}</div><div class="table-count">Hiển thị ${shown.length}/${trips.length} chuyến</div><div class="table-wrap"><table><thead><tr>${columns.map(column=>sortHead(column.label,column.key===data.dateColumn.key?'date':column.key===data.driverColumn.key?'driver':column.key,'trips')).join('')}</tr></thead><tbody>${shown.map(trip=>`<tr>${columns.map(column=>{const isCost=data.costColumns.some(cost=>cost.key===column.key),raw=column.key===data.dateColumn.key?trip.date:column.key===data.driverColumn.key?trip.driver:trip.cells[column.key]||'';return `<td class="${isCost?'money':''}">${text(isCost&&/^-?[\d.,]+$/.test(raw.trim())?money(parseMoney(raw)):raw||'—')}</td>`;}).join('')}</tr>`).join('')||`<tr><td colspan="${columns.length}">Không có dữ liệu phù hợp.</td></tr>`}</tbody></table></div></section>`;}
    async function managerSalaryView(){const data=await getData('salary'),columns=data.headers.filter(header=>header&&header!=='STT'),records=sortRecords(data.records,'salary',(record,key)=>record[key]);return `${viewHeading('Bảng lương','Tổng hợp bảng lương của toàn bộ lái xe.','salary')}<section class="panel"><div class="table-wrap"><table><thead><tr>${columns.map(column=>sortHead(column,column,'salary')).join('')}</tr></thead><tbody>${records.map(row=>`<tr>${columns.map(column=>`<td class="${/lương|pc |tổng|thực lĩnh|thực nhận/i.test(column)?'money':''}">${/lương|pc |tổng|thực lĩnh|thực nhận/i.test(column)?money(parseMoney(row[column])):text(row[column])}</td>`).join('')}</tr>`).join('')||'<tr><td>Chưa có dữ liệu.</td></tr>'}</tbody></table></div></section>`;}
    async function managerAttendanceView(){const data=await getData('attendance'),dates=data[0]?.marks||[],records=sortRecords(data,'attendance',(record,key)=>key==='name'?record.name:key==='total'?record.total:record.marks.find(mark=>mark.date===key)?.label||'');return `${viewHeading('Chấm công','Theo dõi ngày công của toàn bộ lái xe.','attendance')}<section class="panel"><div class="table-wrap"><table><thead><tr>${sortHead('Họ và tên','name','attendance')}${dates.map(date=>sortHead(date.date,date.date,'attendance')).join('')}${sortHead('Tổng công','total','attendance')}</tr></thead><tbody>${records.map(record=>`<tr><td>${text(record.name)}</td>${record.marks.map(mark=>`<td class="money">${text(mark.label)}</td>`).join('')}<td class="money">${record.total}</td></tr>`).join('')||'<tr><td>Chưa có dữ liệu.</td></tr>'}</tbody></table></div></section>`;}
    async function renderView(){const content=document.getElementById('content');if(!content)return;const serial=++state.renderSerial;if(!currentConfig()){content.innerHTML=state.configError?configErrorView():noMonthView();bindViewEvents();return;}content.innerHTML='<div class="loading"><i class="bi bi-arrow-repeat"></i><span>Đang tải dữ liệu…</span></div>';try{const view=state.profile.role==='driver'?({daily:driverDailyView,salary:driverSalaryView,attendance:driverAttendanceView}[state.activeTab]):({trips:managerTripsView,salary:managerSalaryView,attendance:managerAttendanceView}[state.activeTab]),html=await view();if(serial===state.renderSerial&&document.getElementById('content')){content.innerHTML=html;bindViewEvents();}}catch(error){if(serial===state.renderSerial&&document.getElementById('content')){content.innerHTML=errorView(error,state.activeTab);bindViewEvents();}}}
    function bindViewEvents(){document.querySelectorAll('[data-config-retry]').forEach(button=>button.addEventListener('click',async()=>{state.configError='';button.disabled=true;await loadConfig();renderView();}));document.querySelectorAll('[data-refresh]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.refresh)clearCurrentData(button.dataset.refresh);renderView();}));document.querySelectorAll('[data-month]').forEach(button=>button.addEventListener('click',()=>{state.selectedMonth=button.dataset.month;state.openDay='';render();}));document.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>{state.openDay=state.openDay===button.dataset.day?'':button.dataset.day;renderView();}));document.querySelectorAll('[data-sort-table]').forEach(button=>button.addEventListener('click',()=>{const table=button.dataset.sortTable,key=button.dataset.sortKey,sort=state.sorts[table];state.sorts[table]={key,direction:sort.key===key&&sort.direction==='asc'?'desc':'asc'};renderView();}));const search=document.getElementById('trip-search');if(search)search.addEventListener('input',event=>{state.tripSearch=event.target.value;renderView();});[['trip-driver','tripDriver'],['trip-vehicle','tripVehicle']].forEach(([id,field])=>{const select=document.getElementById(id);if(select)select.addEventListener('change',event=>{state[field]=event.target.value;renderView();});});}
    function bindShellEvents(){document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{state.activeTab=button.dataset.tab;state.openDay='';render();}));document.getElementById('month-select')?.addEventListener('change',event=>{state.selectedMonth=event.target.value;state.openDay='';render();});document.getElementById('sheet-button')?.addEventListener('click',()=>{state.sheetError='';state.sheetModal=true;render();});document.getElementById('password-button')?.addEventListener('click',()=>{state.passwordModal=true;render();});document.getElementById('logout-button')?.addEventListener('click',logout);document.getElementById('cancel-password')?.addEventListener('click',()=>{state.passwordModal=false;render();});document.getElementById('cancel-sheet')?.addEventListener('click',()=>{state.sheetModal=false;state.sheetSaving=false;render();});document.getElementById('password-backdrop')?.addEventListener('click',event=>{if(event.target.id==='password-backdrop'){state.passwordModal=false;render();}});document.getElementById('sheet-backdrop')?.addEventListener('click',event=>{if(event.target.id==='sheet-backdrop'){state.sheetModal=false;state.sheetSaving=false;render();}});document.getElementById('password-form')?.addEventListener('submit',event=>{event.preventDefault();changePassword(event.currentTarget);});document.getElementById('sheet-form')?.addEventListener('submit',event=>{event.preventDefault();saveMonthSheet(event.currentTarget);});}
    function render(){if(!state.authReady||!state.user||!state.profile){APP.innerHTML=renderLogin();document.getElementById('login-form')?.addEventListener('submit',event=>{event.preventDefault();login(event.currentTarget);});return;}APP.innerHTML=renderShell();bindShellEvents();renderView();}
    async function boot(){render();await loadConfig();initialiseFirebase();render();}
    boot();
  </script>
</body>
