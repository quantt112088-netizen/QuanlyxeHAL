    import { getFirestore, collection, doc, getDoc, onSnapshot, setDoc, deleteField } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const APP = document.getElementById('app');
    const TAB_LABELS = { driver:{daily:'Thu nhập theo ngày',salary:'Bảng lương tháng',attendance:'Chấm công'}, manager:{trips:'Chi tiết chuyến',salary:'Bảng lương',attendance:'Chấm công'} };
    const TAB_ICONS = {daily:'bi-cash-stack',trips:'bi-truck',salary:'bi-receipt',attendance:'bi-calendar-check'};
    const HIDDEN_DAILY_COST_KEYS=['dau','epass','phatSinh','rotDiemChiPhiXe'];
    const HIDDEN_DAILY_INFO_PATTERN=/^(fcr|ma chuyen|ma don|doi tac|khach hang|km chuyen|km|so km|quang duong)$/;
    const COST_FIELDS = [
      {key:'dau',label:'Dầu'},
      {key:'epass',label:'Epass'},
      {key:'phatSinh',label:'Phát sinh'},
      {key:'luongChuyen',label:'Lương lái xe theo chuyến'},
      {key:'veVaoKho',label:'Vé vào kho'},
      {key:'bocXep',label:'Bốc xếp'},
      {key:'ghepHang',label:'Ghép hàng'},
      {key:'chuNhat',label:'Chủ nhật'},
      {key:'choGio',label:'Chờ giờ'},
      {key:'anCa2',label:'Ăn ca 2'},
      {key:'tangCa',label:'Tăng ca'},
      {key:'quayDau',label:'Quay đầu'},
      {key:'rotDiemChiPhiXe',label:'Rớt điểm (chi phí xe)'}
    ];
    const DRIVER_DAILY_COST_FIELDS=COST_FIELDS.filter(field=>!HIDDEN_DAILY_COST_KEYS.includes(field.key));
    const ALLOWANCE_KEYS = COST_FIELDS.filter(field=>field.key!=='luongChuyen').map(field=>field.key);
    const currentMonth = new Date().toLocaleDateString('en-CA',{year:'numeric',month:'2-digit'}).slice(0,7);
    const state = { config:null,fileConfig:null,remoteConfig:{},configError:'',selectedMonth:currentMonth,auth:null,db:null,sheetsUnsubscribe:null,authReady:false,authLoading:false,authError:'',firebaseError:'',user:null,profile:null,profileError:'',activeTab:'daily',cache:new Map(),openDay:'',tripSearch:'',tripDriver:'',tripVehicle:'',tripStatus:'',sorts:{trips:{key:'date',direction:'desc'},salary:{key:'Họ và tên',direction:'asc'},attendance:{key:'name',direction:'asc'}},passwordModal:false,sheetModal:false,sheetEditMonth:null,sheetError:'',sheetSuccess:'',sheetSaving:false,renderSerial:0 };
    const AUTH_TIMEOUT_MS = 15000;

    const escapeHtml = (value='') => String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const text = value => escapeHtml(value ?? '');
    const money = value => `${(Number(value)||0).toLocaleString('vi-VN')} đ`;
    const parseMoney = value => { const clean=String(value??'').replace(/[^\d-]/g,''); return clean ? Number.parseInt(clean,10)||0 : 0; };
    function normalizeLabel(value=''){return String(value).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/đ/g,'d').replace(/\s+/g,' ').trim();}
    const namesMatch = (left,right) => normalizeLabel(left)===normalizeLabel(right);
    function parseVNDate(value){const m=/(?:(\d{1,2})\/(\d{1,2})\/(\d{4})|(\d{4})-(\d{1,2})-(\d{1,2}))/.exec(String(value||''));if(!m)return 0;return m[3]?new Date(+m[3],+m[2]-1,+m[1]).getTime():new Date(+m[4],+m[5]-1,+m[6]).getTime();}
    function splitVNDate(value,fallbackYear){const m=/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/.exec(String(value||''));return m?{day:+m[1],month:+m[2],year:m[3]?+m[3]:(fallbackYear||null)}:null;}

uthLoading=false;state.authReady=true;render();}});}catch(error){console.error('[Hoàng Anh Auth] Khởi tạo Firebase thất bại:',error);state.firebaseError=`Không thể khởi tạo Firebase: ${firebaseMessage(error)}`;state.authReady=true;}}

    async function driverDailyView(){const data=await getData('trips'),trips=data.records.filter(trip=>namesMatch(trip.driver,currentDriverName())),byDate=new Map();trips.forEach(trip=>{const day=byDate.get(trip.date)||{date:trip.date,trips:[],wage:0,allowance:0};day.trips.push(trip);day.wage+=trip.costs.luongChuyen;day.allowance+=sumCosts([trip],ALLOWANCE_KEYS);byDate.set(trip.date,day);});const days=[...byDate.values()].sort((a,b)=>parseVNDate(b.date)-parseVNDate(a.date)),totalWage=sumCosts(trips,['luongChuyen']),totalAllowance=sumCosts(trips,ALLOWANCE_KEYS),visibleInfoColumns=driverTripInfoColumns(data.infoColumns),tripInfo=trip=>visibleInfoColumns.map(column=>trip.cells[column.key]).filter(Boolean).join(' · ')||'Chuyến hàng';return `${viewHeading('Thu nhập theo ngày','Lương chuyến và phụ cấp được cập nhật từ bảng chuyến.','trips')}<div class="metric-grid"><div class="metric"><span class="label">Tổng lương chuyến</span><strong class="value teal">${money(totalWage)}</strong></div><div class="metric"><span class="label">Tổng phụ cấp / phát sinh khác</span><strong class="value amber">${money(totalAllowance)}</strong></div><div class="metric"><span class="label">Số chuyến · số ngày có chuyến</span><strong class="value">${trips.length} · ${days.length}</strong></div></div><section class="panel"><div class="panel-heading"><div><h3>Danh sách theo ngày</h3><p>Nhấn vào từng ngày để xem đầy đủ từng khoản của chuyến.</p></div></div>${days.length?`<div class="day-list">${days.map(day=>`<article class="day-card"><button class="day-toggle" type="button" data-day="${text(day.date)}"><span class="day-title"><strong>${text(day.date)}</strong><span>${day.trips.length} chuyến · Lương chuyến ${money(day.wage)}</span></span><span class="amount">Phụ cấp ${money(day.allowance)} <i class="bi bi-chevron-${state.openDay===day.date?'up':'down'}"></i></span></button>${state.openDay===day.date?`<div class="trip-details">${day.trips.map(trip=>`<div class="trip-detail"><div class="trip-detail-     function salaryItemHTML(label,value,isMoney){const hasValue=value!==undefined&&value!==null&&String(value).trim()!=='';return `<div class="salary-item"><div class="label">${text(label)}</div><div class="value">${hasValue?(isMoney?money(parseMoney(value)):text(value)):'Chưa có dữ liệu'}</div></div>`;}
    async function driverSalaryView(){const data=await getData('salary'),row=data.records.find(record=>namesMatch(record['Họ và tên'],currentDriverName()));if(!row)return `${viewHeading('Bảng lương tháng','Số liệu tổng hợp từ bảng lương.','salary')}<section class="panel"><div class="empty-state"><i class="bi bi-person-x"></i><strong>Chưa có bảng lương</strong><p>Không tìm thấy dòng lương tương ứng với tên tài xế trong Google Sheet.</p></div></section>`;const kyLuong=row['Kỳ lương']||data.kyLuong||'';const mismatch=kyLuong&&/^(\d{2})\/(\d{4})$/.test(kyLuong)&&kyLuong.replace('/','-')!==state.selectedMonth.split('-').reverse().join('-');const sourceParam=label=>Object.entries(data.params||{}).find(([key])=>normalizeLabel(key)===normalizeLabel(label))?.[1];const baseSalaryEligibility=String(row['Hưởng lương CB?']??'').trim(),hasBaseSalary=parseMoney(row['Lương cơ bản'])>0,fixed=[['Hưởng lương CB?',baseSalaryEligibility&&!/^#(?:NAME|REF|VALUE|N\/A|ERROR)/i.test(baseSalaryEligibility)?baseSalaryEligibility:(hasBaseSalary?'Có':'Không'),false],['Ngày công',row['Ngày công'],false],['Lương cơ bản',row['Lương cơ bản'],true],['PC ăn trưa',row['PC ăn trưa'],true],['PC xăng dầu',row['PC xăng dầu'],true],['PC điện thoại',row['PC điện thoại'],true],['PC công việc / tháng (tham số nguồn)',sourceParam('Phụ cấp công việc / tháng'),true],['PC chuyên cần',row['PC chuyên cần'],true],['Nghỉ phép',row['Nghỉ phép'],true],['Hưởng HT nhà ở?',row['Hưởng HT nhà ở?'],false],['Phụ cấp nhà ở',row['Phụ cấp nhà ở'],true]];const tripItems=[['Lương chuyến',row['Lương chuyến']],['Vé vào kho',row['Vé vào kho']],['Bốc xếp',row['Bốc xếp']],['Ghép hàng',row['Ghép hàng']],['Chủ nhật',row['Chủ nhật']],['Chờ giờ',row['Chờ giờ']],['Ăn ca 2',row['Ăn ca 2']],['Tăng ca',row['Tăng ca']]],tripAllowanceTotal=['Vé vào kho','Bốc xếp','Ghép hàng','Chủ nhật','Chờ giờ','Ăn ca 2','Tăng ca'].reduce((sum,key)=>sum+parseMoney(row[key]),0),takeHome=String(row['TỔNG THỰC LĨNH']??'').trim();return `${viewHeading('Bảng lương tháng','Số liệu tổng hợp được cập nhật từ quản lý.','salary')}${mismatch?`<div class="salary-warning">Kỳ lương trong sheet nguồn đang là ${text(kyLuong)}, khác với tháng dữ liệu đang xem (${text(monthLabel(state.selectedMonth))}). Đây là dữ liệu nguồn, app không tự thay đổi.</div>`:''}<section class="panel"><div class="salary-total"><small>${text(row['Họ và tên'])} · Kỳ lương ${text(kyLuong||'theo nguồn')} · TỔNG THỰC LĨNH</small><strong>${takeHome?money(parseMoney(takeHome)):'Chưa có dữ liệu'}</strong></div><div class="salary-section"><h4>Thông tin &amp; khoản cố định</h4><div class="salary-grid">${fixed.map(([label,value,isMoney])=>salaryItemHTML(label,value,isMoney)).join('')}</div></div><div class="salary-section"><h4>Lương chuyến và phụ cấp theo chuyến</h4><div class="salary-grid">${tripItems.map(([label,value])=>salaryItemHTML(label,value,true)).join('')}${salaryItemHTML('Tổng phụ cấp theo chuyến (O–U)',tripAllowanceTotal,true)}${salaryItemHTML('Tổng lương chuyến + PS',row['Tổng lương chuyến + PS'],true)}</div></div><div class="salary-section"><h4>Tổng hợp</h4><div class="salary-grid">${salaryItemHTML('Tổng lương CB + PC',row['Tổng lương CB + PC'],true)}${salaryItemHTML('TỔNG THỰC LĨNH',row['TỔNG THỰC LĨNH'],true)}</div></div></section>`;}
    function attendanceDayInfo(mark){const parsed=splitVNDate(mark.date,mark.year);if(!parsed)return {lunar:'',holiday:[],anniversary:[],isHoliday:false,isAnniversary:false};const lunar=solarToLunar(parsed.day,parsed.month,parsed.year,7);const official=lunarHoliday(lunar.year,lunar.month,lunar.day,lunar.leap);const solar=solarHolidays(parsed.year,parsed.month,parsed.day);const holiday=[...official,...solar.filter(name=>['Tết Dương lịch','Ngày Giải phóng miền Nam','Quốc tế Lao động','Quốc khánh'].includes(name))];const anniversary=solar.filter(name=>!holiday.includes(name));return {lunar:`${lunar.day}/${lunar.month}`,holiday,anniversary,isHoliday:holiday.length>0,isAnniversary:anniversary.length>0};}
    async function driverAttendanceView(){const data=await getData('attendance'),record=data.find(item=>namesMatch(item.name,currentDriverName()));if(!record)return `${viewHeading('Chấm công','Tổng hợp ngày công trong tháng.','attendance')}<section class="panel"><div class="empty-state"><i class="bi bi-person-x"></i><strong>Chưa có chấm công</strong><p>Không tìm thấy dòng chấm công tương ứng với tên tài xế.</p></div></section>`;const ym=selectedYM(),shownMarks=record.marks.filter(mark=>{const parsed=splitVNDate(mark.date,mark.year);return parsed&&ym?parsed.month===ym.month&&parsed.year===ym.year:true;});return `${viewHeading('Chấm công','Tổng hợp ngày công trong tháng.','attendance')}<section class="panel"><div class="attendance-summary"><div class="attendance-chip"><b>${record.total}</b><span>ngày công</span></div>${record.probation!==undefined?`<div class="attendance-chip"><b>${record.probation}</b><span>công thử việc</span></div>`:''}${record.official!==undefined?`<div class="attendance-chip"><b>${record.official}</b><span>công chính thức</span></div>`:''}<div class="attendance-chip"><b>${shownMarks.length}</b><span>ngày trong bảng</span></div></div><div class="attendance-legend"><span><i class="bi bi-check-circle-fill"></i>X: có chuyến, tính công</span><span><i class="bi bi-circle-half"></i>½: nửa công</span><span><i class="bi bi-star-fill"></i>Nghỉ lễ</span><span><i class="bi bi-heart-fill"></i>Kỷ niệm</span><span>Chủ nhật có thể đánh X nhưng không cộng ngày công</span></div><div class="attendance-grid">${shownMarks.map(mark=>{const info=attendanceDayInfo(mark);const classes=['attendance-cell',mark.status==='off'?'':mark.status,mark.isSunday?'sunday':'',info.isHoliday?'holiday':'',info.isAnniversary?'anniversary':''].filter(Boolean).join(' ');const tooltip=[...info.holiday,...info.anniversary].join(' · ')||'';return `<div class="${classes}" ${tooltip?`title="${text(tooltip)}"`:''}><b class="day-num">${text(mark.date.split('/')[0])}</b><span class="weekday">${te     function sortRecords(records,table,valueFor){const {key,direction}=state.sorts[table],sign=direction==='asc'?1:-1;return [...records].sort((left,right)=>{const a=valueFor(left,key),b=valueFor(right,key);if(/date|ngày/i.test(key))return(parseVNDate(a)-parseVNDate(b))*sign;const an=typeof a==='number'?a:parseMoney(a),bn=typeof b==='number'?b:parseMoney(b);if(an||bn)return(an-bn)*sign;return String(a||'').localeCompare(String(b||''),'vi')*sign;});}
    function sortHead(label,key,table){const sort=state.sorts[table],icon=sort.key===key?(sort.direction==='asc'?'bi-arrow-up':'bi-arrow-down'):'bi-arrow-down-up';return `<th><button type="button" data-sort-table="${table}" data-sort-key="${text(key)}">${text(label)} <i class="bi ${icon}"></i></button></th>`;}
    async function managerTripsView(){const data=await getData('trips'),trips=data.records,values=field=>[...new Set(trips.map(trip=>trip[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));let shown=trips.filter(trip=>(!state.tripSearch||trip.searchText.toLowerCase().includes(state.tripSearch.toLowerCase()))&&(!state.tripDriver||trip.driver===state.tripDriver)&&(!state.tripVehicle||trip.vehicle.includes(state.tripVehicle)));shown=sortRecords(shown,'trips',(trip,key)=>key==='date'?trip.date:key==='driver'?trip.driver:key==='vehicle'?trip.vehicle:trip.cells[key]||'');const vehicleValues=values('vehicle'),columns=[data.dateColumn,data.driverColumn,...data.infoColumns,...data.costColumns];return `${viewHeading('Chi tiết chuyến','Hiển thị thông tin chuyến xe và toàn bộ chi phí theo từng chuyến.','trips')}<section class="panel"><div class="filters"><input class="input search" id="trip-search" type="search" placeholder="Tìm theo ngày, lái xe, thông tin chuyến…" value="${text(state.tripSearch)}"><select id="trip-driver"><option value="">Tất cả lái xe</option>${values('driver').map(value=>`<option value="${text(value)}" ${value===state.tripDriver?'selected':''}>${text(value)}</option>`).join('')}</select>${vehicleValues.length?`<select id="trip-vehicle"><option value="">Tất cả loại/biển số xe</option>${vehicleValues.map(value=>`<option value="${text(value)}" ${value===state.tripVehicle?'selected':''}>${text(value)}</option>`).join('')}</select>`:''}</div><div class="table-count">Hiển thị ${shown.length}/${trips.length} chuyến</div><div class="table-wrap"><table><thead><tr>${columns.map(column=>sortHead(column.label,column.key===data.dateColumn.key?'date':column.key===data.driverColumn.key?'driver':column.key,'trips')).join('')}</tr></thead><tbody>${shown.map(trip=>`<tr>${columns.map(column=>{const isCost=data.costColumns.some(cost=>cost.key===column.key),raw=column.key===data.dateColumn.key?trip.date:column.key===data.driverColumn.key?trip.driver:trip.cells[colum     async function managerSalaryView(){const data=await getData('salary'),columns=data.headers.filter(header=>header&&header!=='STT'),records=sortRecords(data.records,'salary',(record,key)=>record[key]);return `${viewHeading('Bảng lương','Tổng hợp bảng lương của toàn bộ lái xe.','salary')}<section class="panel"><div class="table-wrap"><table><thead><tr>${columns.map(column=>sortHead(column,column,'salary')).join('')}</tr></thead><tbody>${records.map(row=>`<tr>${columns.map(column=>`<td class="${/lương|pc |tổng|thực lĩnh|thực nhận/i.test(column)?'money':''}">${String(row[column]??'').trim()?(/lương|pc |tổng|thực lĩnh|thực nhận/i.test(column)?money(parseMoney(row[column])):text(row[column])):'Chưa có dữ liệu'}</td>`).join('')}</tr>`).join('')||'<tr><td>Chưa có dữ liệu.</td></tr>'}</tbody></table></div></section>`;}
    async function managerAttendanceView(){const data=await getData('attendance'),ym=selectedYM(),dates=(data[0]?.marks||[]).filter(mark=>{const parsed=splitVNDate(mark.date,mark.year);return parsed&&ym?parsed.month===ym.month&&parsed.year===ym.year:true;});return `${viewHeading('Chấm công','Theo dõi ngày công của toàn bộ lái xe.','attendance')}<section class="panel"><div class="table-wrap"><table><thead><tr>${sortHead('Họ và tên','name','attendance')}${dates.map(date=>sortHead(date.date,date.date,'attendance')).join('')}${sortHead('Ngày công','total','attendance')}</tr></thead><tbody>${data.map(record=>`<tr><td>${text(record.name)}</td>${record.marks.filter(mark=>{const parsed=splitVNDate(mark.date,mark.year);return parsed&&ym?parsed.month===ym.month&&parsed.year===ym.year:true;}).map(mark=>`<td class="money">${text(mark.label)}</td>`).join('')}<td class="money">${record.total}</td></tr>`).join('')||'<tr><td>Chưa có dữ liệu.</td></tr>'}</tbody></table></div></section>`;}
    async function renderView(){const content=document.getElementById('content');if(!content)return;const serial=++state.renderSerial;if(!currentConfig()){content.innerHTML=state.configError?configErrorView():noMonthView();bindViewEvents();return;}content.innerHTML='<div class="loading"><i class="bi bi-arrow-repeat"></i><span>Đang tải dữ liệu…</span></div>';try{const view=state.profile.role==='driver'?({daily:driverDailyView,salary:driverSalaryView,attendance:driverAttendanceView}[state.activeTab]):({trips:managerTripsView,salary:managerSalaryView,attendance:managerAttendanceView}[state.activeTab]),html=await view();if(serial===state.renderSerial&&document.getElementById('content')){content.innerHTML=html;bindViewEvents();}}catch(error){if(serial===state.renderSerial&&document.getElementById('content')){content.innerHTML=errorView(error,state.activeTab);bindViewEvents();}}}
    function bindViewEvents(){document.querySelectorAll('[data-config-retry]').forEach(button=>button.addEventListener('click',async()=>{state.configError='';button.disabled=true;await loadConfig();renderView();}));document.querySelectorAll('[data-refresh]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.refresh)clearCurrentData(button.dataset.refresh);renderView();}));document.querySelectorAll('[data-month]').forEach(button=>button.addEventListener('click',()=>{state.selectedMonth=button.dataset.month;state.openDay='';render();}));document.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>{state.openDay=state.openDay===button.dataset.day?'':button.dataset.day;renderView();}));document.querySelectorAll('[data-sort-table]').forEach(button=>button.addEventListener('click',()=>{const table=button.dataset.sortTable,key=button.dataset.sortKey,sort=state.sorts[table];state.sorts[table]={key,direction:sort.key===key&&sort.direction==='asc'?'desc':'asc'};renderView();}));const search=document.getElementById('trip-search');if(search)search.addEventListener('input',event=>{state.tripSearch=event.target.value;renderView();});[['trip-driver','tripDriver'],['trip-vehicle','tripVehicle']].forEach(([id,field])=>{const select=document.getElementById(id);if(select)select.addEventListener('change',event=>{state[field]=event.target.value;renderView();});});}
    function bindShellEvents(){document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{state.activeTab=button.dataset.tab;state.openDay='';render();}));document.getElementById('month-select')?.addEventListener('change',event=>{state.selectedMonth=event.target.value;state.openDay='';render();});document.getElementById('sheet-button')?.addEventListener('click',()=>{state.sheetError='';state.sheetSuccess='';state.sheetEditMonth=null;state.sheetModal=true;render();});document.getElementById('password-button')?.addEventListener('click',()=>{state.passwordModal=true;render();});document.getElementById('logout-button')?.addEventListener('click',logout);document.getElementById('cancel-password')?.addEventListener('click',()=>{state.passwordModal=false;render();});document.querySelectorAll('[data-sheet-edit]').forEach(button=>button.addEventListener('click',()=>{state.sheetEditMonth=button.dataset.sheetEdit;state.sheetError='';state.sheetSuccess='';render();}));document.getElementById('cancel-sheet')?.addEventListener('click',()=>{state.sheetModal=false;state.sheetEditMonth=null;state.sheetSaving=false;state.sheetError='';state.sheetSuccess='';render();});document.getElementById('password-backdrop')?.addEventListener('click',event=>{if(event.target.id==='password-backdrop'){state.passwordModal=false;render();}});document.getElementById('sheet-backdrop')?.addEventListener('click',event=>{if(event.target.id==='sheet-backdrop'){state.sheetModal=false;state.sheetEditMonth=null;state.sheetSaving=false;state.sheetError='';state.sheetSuccess='';render();}});document.getElementById('password-form')?.addEventListener('submit',event=>{event.preventDefault();changePassword(event.currentTarget);});document.getElementById('sheet-form')?.addEventListener('submit',event=>{event.preventDefault();saveMonthSheet(event.currentTarget);});}
