      if(headerIndex<0)throw new Error('Không tìm thấy cột “Họ và tên” trong tab “Chấm công”.');
      const weekdayRow=rows[headerIndex]||[],dateRow=rows[headerIndex+1]||[],nameIndex=weekdayRow.findIndex(value=>normalizeLabel(value)==='ho va ten');
      const rangeDate=rows.slice(0,headerIndex).flat().map(value=>splitVNDate(value)).find(value=>value?.year);
      const fallbackYear=rangeDate?.year||selectedYM()?.year;
      const verifiedPositionalSummary=nameIndex===1&&Math.max(...rows.map(row=>row.length))>=36&&dateRow.slice(2,33).filter(Boolean).length>=28;
      const summaryColumns=[];['ngay cong','ngay cong thu viec','ngay cong chinh thuc'].forEach((target,order)=>{let found=weekdayRow.findIndex((value,index)=>index>nameIndex&&normalizeLabel(value)===target);if(found<0&&verifiedPositionalSummary)found=nameIndex+32+order;if(found>=0)summaryColumns.push({index:found,key:['total','probation','official'][order],label:weekdayRow[found]||['Ngày công','Ngày công thử việc','Ngày công chính thức'][order]});});
      const maxIndex=Math.max(weekdayRow.length,dateRow.length);
      const summaryIndexes=new Set(summaryColumns.map(column=>column.index));
      const dates=[];for(let index=nameIndex+1;index<maxIndex;index+=1){if(summaryIndexes.has(index))continue;const date=String(dateRow[index]??'').trim();if(!date)continue;const weekday=String(weekdayRow[index]??'').trim();const parsed=splitVNDate(date,fallbackYear);const computedWeekday=weekday||(parsed?.year?WEEKDAYS_VI[new Date(parsed.year,parsed.month-1,parsed.day).getDay()]:'');dates.push({index,date,year:parsed?.year||fallbackYear,weekday:computedWeekday,isSunday:['CN','Chủ nhật'].includes(computedWeekday)});}
      return rows.slice(headerIndex+2).filter(row=>String(row?.[nameIndex]||'').trim()).map(row=>{const marks=dates.map(item=>({...item,...parseMark(row[item.index])}));const summary=Object.fromEntries(summaryColumns.map(column=>[column.key,Number(String(row[column.index]??'0').replace(/[^\d.,]/g,'').replace(',','.'))||0]));const computed=marks.filter(mark=>!mark.isSunday).reduce((sum,mark)=>sum+mark.value,0);return {name:String(row[nameIndex]).trim(),marks,total:summary.total??computed,probation:summary.probation,official:summary.official};});
    }

    function initialiseFirebase(){const configError=firebaseConfigError();if(configError){console.error('[Hoàng Anh Auth] Cấu hình Firebase không hợp lệ:',configError);state.firebaseError=configError;state.authReady=true;return;}try{const app=initializeApp(window.FIREBASE_CONFIG);state.auth=getAuth(app);state.db=getFirestore(app);onAuthStateChanged(state.auth,async user=>{state.user=user;state.profile=null;if(!user){state.authLoading=false;state.authReady=true;render();return;}console.info('[Hoàng Anh Auth] Firebase Auth đăng nhập thành công:',{uid:user.uid,email:user.email});state.profileError='';try{console.info('[Hoàng Anh Auth] Bắt đầu đọc hồ sơ Firestore:',`users/${user.uid}`);const snapshot=await withTimeout(getDoc(doc(state.db,'users',user.uid)),'Đọc hồ sơ Firestore'),profile=snapshot.data(),profileFields=Object.keys(profile||{});console.info('[Hoàng Anh Auth] Đọc hồ sơ Firestore thành công:',{uid:user.uid,exists:snapshot.exists(),fields:profileFields});const isOwner=profile?.isOwner===true,role=['driver','manager'].includes(profile?.role)?profile.role:isOwner?'manager':profile?.role,problems=[!snapshot.exists()?'Không tìm thấy document hồ sơ.':'',!['driver','manager'].includes(role)?'Field role phải là “driver” hoặc “manager”.':'',role==='driver'&&!String(profile?.driverName||'').trim()?'Tài khoản lái xe thiếu field driverName hợp lệ.':''].filter(Boolean);if(problems.length){console.warn('[Hoàng Anh Auth] Hồ sơ không hợp lệ:',{uid:user.uid,fields:profileFields,problems});state.profileError='Tài khoản chưa có hồ sơ hoặc quyền hợp lệ. Hãy liên hệ quản trị viên.';signOut(state.auth).catch(()=>{});}else{state.profile={role,driverName:String(profile.driverName||'').trim(),isOwner};state.activeTab=role==='manager'?'trips':'daily';subscribeToSheetMonths();subscribeToPlanBeta();}}catch(error){console.error('[Hoàng Anh Auth] Đọc hồ sơ Firestore thất bại:',error);state.profileError=`Không thể đọc hồ sơ tài khoản: ${firebaseMessage(error)}`;signOut(state.auth).catch(()=>{});}finally{state.authLoading=false;state.authReady=true;render();}});}catch(error){console.error('[Hoàng Anh Auth] Khởi tạo Firebase thất bại:',error);state.firebaseError=`Không thể khởi tạo Firebase: ${firebaseMessage(error)}`;state.authReady=true;}}

    async function changePassword(form){const oldPassword=form.oldPassword.value,newPassword=form.newPassword.value,repeatPassword=form.repeatPassword.value,message=document.getElementById('password-message');if(!oldPassword||!newPassword||!repeatPassword){message.textContent='Vui lòng nhập đầy đủ thông tin.';return;}if(newPassword.length<6){message.textContent='Mật khẩu mới cần ít nhất 6 ký tự.';return;}if(newPassword!==repeatPassword){message.textContent='Mật khẩu mới nhập lại không khớp.';return;}const submit=form.querySelector('[type=submit]');submit.disabled=true;submit.textContent='Đang cập nhật…';try{await reauthenticateWithCredential(state.user,EmailAuthProvider.credential(state.user.email,oldPassword));await updatePassword(state.user,newPassword);state.passwordModal=false;render();}catch(error){message.textContent=firebaseMessage(error);submit.disabled=false;submit.textContent='Đổi mật khẩu';}}
    function extractSheetId(url){return /\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/.exec(String(url||''))?.[1]||'';}
    function extractGid(url){const raw=String(url||''),hash=/#gid=(\d+)/.exec(raw)?.[1],query=/[?&]gid=(\d+)/.exec(raw)?.[1];return hash||query||'';}
    async function saveMonthSheet(form){
      const month=String(form.month.value||'').trim(),sourceUrl=String(form.sheetUrl.value||'').trim(),sheetId=extractSheetId(sourceUrl);
      const gidTrips=String(form.gidTrips?.value||'').trim()||extractGid(sourceUrl),gidSalary=String(form.gidSalary?.value||'').trim(),gidAttendance=String(form.gidAttendance?.value||'').trim();

,id]=form.dataset.planCatalogEdit.split(':');updatePlanCatalog(category,id,form);}));document.querySelectorAll('[data-plan-catalog-delete]').forEach(button=>button.addEventListener('click',()=>{const [category,id]=button.dataset.planCatalogDelete.split(':');removePlanCatalog(category,id);}));document.getElementById('plan-cargo-seed')?.addEventListener('click',seedPlanCargoCatalog);const planForm=document.getElementById('plan-entry-form');if(planForm){updatePlanVehicleTonnage(planForm);updatePlanDerived(planForm);updatePlanCargoRouteOptions(planForm,true);planForm.addEventListener('input',event=>{if(['km_pickup','km_return','vehicle_revenue'].includes(event.target.name))updatePlanDerived(planForm);});planForm.elements.plate?.addEventListener('change',()=>updatePlanVehicleTonnage(planForm));planForm.elements.cargo_select?.addEventListener('change',()=>updatePlanCargoRouteOptions(planForm));planForm.elements.route_select?.addEventListener('change',()=>setPlanFieldVisibility(planForm.elements.route_manual,planForm.elements.route_select.value==='__manual__'));planForm.addEventListener('submit',event=>{event.preventDefault();savePlanEntry(planForm);});}document.getElementById('plan-entry-reset')?.addEventListener('click',()=>{state.planEditingId=null;state.planError='';state.planNotice='';renderView();});document.getElementById('beta-month-select')?.addEventListener('change',event=>{state.betaMonth=event.target.value;renderView();});[['plan-table-from','planTableFrom'],['plan-table-to','planTableTo'],['plan-table-plate','planTablePlate']].forEach(([id,key])=>{document.getElementById(id)?.addEventListener('change',event=>{state[key]=event.target.value;renderView();});});document.getElementById('plan-search')?.addEventListener('input',event=>{state.planSearch=event.target.value;renderView();});document.querySelectorAll('[data-plan-edit]').forEach(button=>button.addEventListener('click',()=>{state.planEditingId=button.dataset.planEdit;state.planError='';state.planNotice='';state.activeTab='planInput';render();}));document.querySelectorAll('[data-plan-delete]').forEach(button=>button.addEventListener('click',()=>removePlanEntry(button.dataset.planDelete)));document.getElementById('plan-export')?.addEventListener('click',exportPlanXlsx);const repairForm=document.getElementById('repair-entry-form');if(repairForm){updateRepairTotal(repairForm);repairForm.addEventListener('input',event=>{if(['thanh_tien_chua_vat','vat_percent'].includes(event.target.name))updateRepairTotal(repairForm);});repairForm.addEventListener('submit',event=>{event.preventDefault();saveRepairEntry(repairForm);});}document.getElementById('repair-entry-reset')?.addEventListener('click',()=>{state.repairEditingId=null;state.repairError='';state.repairNotice='';renderView();});document.getElementById('repair-month-select')?.addEventListener('change',event=>{state.repairMonth=event.target.value;state.repairSearch='';renderView();});document.getElementById('repair-search')?.addEventListener('input',event=>{state.repairSearch=event.target.value;renderView();});document.querySelectorAll('[data-repair-edit]').forEach(button=>button.addEventListener('click',()=>{state.repairEditingId=button.dataset.repairEdit;state.repairError='';state.repairNotice='';state.activeTab='repairInput';render();}));document.querySelectorAll('[data-repair-delete]').forEach(button=>button.addEventListener('click',()=>removeRepairEntry(button.dataset.repairDelete)));document.getElementById('repair-export')?.addEventListener('click',exportRepairXlsx);document.getElementById('plan-sub-customer')?.addEventListener('change',event=>{state.planSubCustomer=event.target.value;renderView();});bindPlanRange('sub','planSubFrom','planSubTo');bindPlanRange('operating-costs','planOperatingCostsFrom','planOperatingCostsTo');document.getElementById('plan-operating-costs-export')?.addEventListener('click',exportPlanOperatingCostsXlsx);bindPlanRange('attendance','planAttendanceFrom','planAttendanceTo');bindPlanRange('salary','planSalaryFrom','planSalaryTo');document.getElementById('plan-sub-export')?.addEventListener('click',exportPlanSubXlsx);document.getElementById('plan-salary-params-form')?.addEventListener('submit',event=>{event.preventDefault();savePlanSalaryParameters(event.currentTarget);});document.querySelectorAll('[data-plan-salary-adjust]').forEach(form=>{const driverId=form.dataset.planSalaryAdjust,queueSave=(delay=0)=>{const range=planRangeForState('planSalaryFrom','planSalaryTo'),id=planSalaryDraft(driverId,range,planSalaryAdjustmentValues(form)),timers=planSalarySaveTimers();clearTimeout(timers.get(id));planSalarySaveStates().set(id,{state:'saving',message:delay?'Sẽ lưu tự động…':'Đang lưu tự động…'});planSalaryRowPreview(driverId);planSalaryStatusPreview(driverId,range);timers.set(id,setTimeout(()=>{timers.delete(id);savePlanSalaryAdjustment(driverId,form);},delay));};form.elements.housing_eligible?.addEventListener('change',()=>queueSave());form.elements.insurance_eligible?.addEventListener('change',()=>queueSave());form.elements.leave_pay?.addEventListener('input',()=>queueSave(450));form.addEventListener('submit',event=>{event.preventDefault();queueSave();});});document.getElementById('plan-salary-export')?.addEventListener('click',exportPlanSalaryXlsx);}
    function bindShellEvents(){document.querySelectorAll('[data-nav-group]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.navGroup;state.navGroupsOpen[id]=!navGroupOpen(id);render();}));document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{state.activeTab=button.dataset.tab;const group=navGroupForTab(state.activeTab);if(group)state.navGroupsOpen[group]=true;state.openDay='';if(!BETA_TABS.has(state.activeTab)){state.planEditingId=null;state.planError='';state.planNotice='';}render();}));document.getElementById('month-select')?.addEventListener('change',event=>{state.selectedMonth=event.target.value;state.openDay='';render();});document.getElementById('sheet-button')?.addEventListener('click',()=>{state.sheetError='';state.sheetSuccess='';state.sheetEditMonth=null;state.sheetModal=true;render();});document.getElementById('password-button')?.addEventListener('click',()=>{state.passwordModal=true;render();});document.getElementById('logout-button')?.addEventListener('click',logout);document.getElementById('cancel-password')?.addEventListener('click',()=>{state.passwordModal=false;render();});document.querySelectorAll('[data-sheet-edit]').forEach(button=>button.addEventListener('click',()=>{state.sheetEditMonth=button.dataset.sheetEdit;state.sheetError='';state.sheetSuccess='';render();}));document.getElementById('cancel-sheet')?.addEventListener('click',()=>{state.sheetModal=false;state.sheetEditMonth=null;state.sheetSaving=false;state.sheetError='';state.sheetSuccess='';render();});document.getElementById('password-backdrop')?.addEventListener('click',event=>{if(event.target.id==='password-backdrop'){state.passwordModal=false;render();}});document.getElementById('sheet-backdrop')?.addEventListener('click',event=>{if(event.target.id==='sheet-backdrop'){state.sheetModal=false;state.sheetEditMonth=null;state.sheetSaving=false;state.sheetError='';state.sheetSuccess='';render();}});document.getElementById('password-form')?.addEventListener('submit',event=>{event.preventDefault();changePassword(event.currentTarget);});document.getElementById('sheet-form')?.addEventListener('submit',event=>{event.preventDefault();saveMonthSheet(event.currentTarget);});}
    function render(){if(!state.authReady||!state.user||!state.profile){APP.innerHTML=renderLogin();document.getElementById('login-form')?.addEventListener('submit',event=>{event.preventDefault();login(event.currentTarget);});return;}APP.innerHTML=renderShell();bindShellEvents();renderView();}
